name: Probe package visibility endpoints

# Figure out which endpoint actually flips a GitHub Packages npm package to
# public. GITHUB_TOKEN is a repo-scoped token, so /user/packages/* (a
# user-to-server endpoint) 404s. This probes the variants that can work with
# a workflow token.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List the package and try visibility variants
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "--- who am I ---"
          gh api /user --jq '.login + " type=" + .type' 2>&1 | head -2

          echo "--- GET /users/aazh2026/packages/npm/specgate ---"
          gh api /users/aazh2026/packages/npm/specgate 2>&1 | head -6

          echo "--- GET /user/packages/npm/specgate ---"
          gh api /user/packages/npm/specgate 2>&1 | head -6

          echo "--- PATCH /user/packages/17255585 ---"
          gh api --method PATCH /user/packages/17255585 -f visibility=public 2>&1 | head -4

          echo "--- PATCH /user/packages/npm/specgate ---"
          gh api --method PATCH /user/packages/npm/specgate -f visibility=public 2>&1 | head -4

          echo "--- POST link repo /user/packages/17255585/repositories ---"
          gh api --method POST /user/packages/17255585/repositories \
            -f repository_id="$(gh api /repos/aazh2026/specgate --jq .id)" 2>&1 | head -4

          echo "--- anonymous read after attempts ---"
          curl -s -o /tmp/p.json -w 'GET -> %{http_code}\n' \
            -H 'Accept: application/vnd.npm.install-v1+json' \
            'https://npm.pkg.github.com/@aazh2026%2fspecgate'
          head -c 200 /tmp/p.json; echo
