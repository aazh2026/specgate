name: Set GitHub Package visibility to public

# The npm package on GitHub Packages inherits visibility from the linked
# repository. specgate is a public repo, but the package was created before
# the link existed, so it can land as private — which makes it unreadable
# without a token and therefore useless as a distribution channel.
#
# This workflow flips the package to public and verifies an anonymous read.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publicize:
    runs-on: ubuntu-latest
    steps:
      - name: Set visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pkg=$(gh api "/user/packages/npm/specgate" --jq '.id' 2>/dev/null || true)
          if [ -z "$pkg" ]; then
            pkg=$(gh api "/users/aazh2026/packages" --jq \
              '.[] | select(.package_type=="npm" and .name=="specgate") | .id' | head -1)
          fi
          echo "package id: ${pkg:-<not found>}"
          if [ -n "$pkg" ]; then
            gh api --method PATCH "/user/packages/$pkg" -f visibility=public
            gh api "/user/packages/$pkg" --jq '"visibility: \(.visibility)"'
          fi

      - name: Verify an anonymous read works
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/pkg.json -w '%{http_code}' \
            -H 'Accept: application/vnd.npm.install-v1+json' \
            'https://npm.pkg.github.com/@aazh2026%2fspecgate')
          echo "anonymous GET -> $code"
          if [ "$code" = "200" ]; then
            echo "OK: package is publicly readable"
            head -c 300 /tmp/pkg.json
          else
            echo "STILL NOT PUBLIC: $(head -c 200 /tmp/pkg.json)"
            exit 1
          fi
