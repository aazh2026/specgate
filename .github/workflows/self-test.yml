name: Self-test the published action

# This workflow runs the action from the repository itself, exactly as a user
# would, to prove the action works end to end.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: specgate
        uses: aazh2026/specgate@v0.1.4
        with:
          min: 0
          spec: examples/invoice-export/SPEC.md

      - name: Check the action produced sane outputs
        run: |
          set -euo pipefail
          echo "score=${{ steps.specgate.outputs.score }}"
          echo "total=${{ steps.specgate.outputs.total }}"
          echo "uncovered=${{ steps.specgate.outputs.uncovered }}"

          # Compare against a direct CLI run in the same working directory.
          # (The action scans the whole repo, so the score is not the same as
          # running inside examples/invoice-export on its own.)
          node "$GITHUB_WORKSPACE/bin/specgate.js" --spec examples/invoice-export/SPEC.md \
            --json-out /tmp/cli.json --quiet
          CLI_SCORE="$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/cli.json','utf8')).score)")"
          CLI_TOTAL="$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/cli.json','utf8')).summary.total)")"
          CLI_UNCOVERED="$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/cli.json','utf8')).summary.uncovered)")"

          test "${{ steps.specgate.outputs.score }}" = "$CLI_SCORE"
          test "${{ steps.specgate.outputs.total }}" = "$CLI_TOTAL"
          test "${{ steps.specgate.outputs.uncovered }}" = "$CLI_UNCOVERED"

          # Do NOT hardcode the repo-wide total. specgate auto-discovers every
          # markdown file with an acceptance-criteria section, so adding a new
          # example crate changes the total and would break this check for a
          # reason that has nothing to do with the action.
          #
          # Instead assert the things that must stay true:
          #   1. every spec that was read contributed at least one criterion
          #      (catches a spec that was found but silently parsed to nothing)
          #   2. the invoice-export example still contributes exactly its own
          #      5 criteria
          #   3. the reported total equals the sum of the per-spec counts
          node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/cli.json", "utf8"));
            const specs = r.specs || [];
            const withCriteria = specs.filter((s) => s.criteria > 0);
            if (withCriteria.length === 0) throw new Error("no spec contributed criteria");
            const invoice = specs.find((s) => s.file === "examples/invoice-export/SPEC.md");
            if (!invoice) throw new Error("invoice-export spec was not discovered");
            if (invoice.criteria !== 5) {
              throw new Error("invoice-export should contribute 5 criteria, got " + invoice.criteria);
            }
            const sum = specs.reduce((n, s) => n + s.criteria, 0);
            if (sum !== r.summary.total) {
              throw new Error(`total ${r.summary.total} != sum of per-spec criteria ${sum}`);
            }
            console.log(`specs=${specs.length} criteria=${r.summary.total} score=${r.score}`);
          '
          echo "action self-test passed"
