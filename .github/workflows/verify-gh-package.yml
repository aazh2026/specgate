name: Verify GitHub Packages install (fixed auth)

# The previous verification failed because setup-node writes .npmrc only when
# `registry-url` is set, and the token never reached npm. This version wires
# it up explicitly and checks anonymous vs. authenticated reads.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure npm auth for GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "@aazh2026:registry=https://npm.pkg.github.com" >> ~/.npmrc
          sed -i 's/_authToken=.*/_authToken=***/' ~/.npmrc
          cat ~/.npmrc

      - name: npm view with token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npm view @aazh2026/specgate --registry=https://npm.pkg.github.com \
            --fetch-timeout=30000 2>&1 | head -10

      - name: install with token and run the CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          rm -rf /tmp/t && mkdir -p /tmp/t && cd /tmp/t
          npm init -y >/dev/null 2>&1
          npm install @aazh2026/specgate --registry=https://npm.pkg.github.com \
            --fetch-timeout=60000 2>&1 | tail -6
          echo "--- installed files ---"
          ls node_modules/@aazh2026/specgate/bin 2>&1 | head -3
          echo "--- run it ---"
          node node_modules/@aazh2026/specgate/bin/specgate.js --version 2>&1 | head -3
