name: Probe JSR OIDC scope creation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC tokens for several audiences and try each
        env:
          ID_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ID_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          for aud in "jsr.io" "jsr" "https://jsr.io" "api.jsr.io" "deno"; do
            T=$(curl -s -H "Authorization: bearer $ID_TOKEN" "${ID_URL}&audience=${aud}")
            echo "=== audience=${aud} len=${#T} ==="
            curl -s -w " HTTP:%{http_code}\n" https://api.jsr.io/user -H "Authorization: Bearer $T" | head -c 200
            echo
          done
          echo "=== default audience (no audience param) ==="
          T=$(curl -s -H "Authorization: bearer $ID_TOKEN" "$ID_URL")
          echo "len=${#T}"
          curl -s -w " HTTP:%{http_code}\n" https://api.jsr.io/user -H "Authorization: Bearer $T" | head -c 300
          echo
          echo "=== decode payload of default token ==="
          T=$(curl -s -H "Authorization: bearer $ID_TOKEN" "$ID_URL")
          echo "$T" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | head -c 400
