name: Probe JSR OIDC scope creation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC tokens for several audiences and try each
        run: |
          set +e
          echo "ID_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          for aud in "jsr" "jsr.io" "https://jsr.io" "api.jsr.io" "deno"; do
            T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${aud}")
            echo "=== audience=${aud} len=${#T} ==="
            curl -s -w " HTTP:%{http_code}\n" https://api.jsr.io/user -H "Authorization: Bearer $T" | head -c 220
            echo
          done
          echo "=== default audience ==="
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")
          echo "len=${#T}"
          curl -s -w " HTTP:%{http_code}\n" https://api.jsr.io/user -H "Authorization: Bearer $T" | head -c 300
          echo
          echo "=== claims ==="
          echo "$T" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | head -c 500
