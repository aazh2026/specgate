name: Publish container to GHCR

# Publishes the CLI as an OCI image to GitHub Container Registry (ghcr.io).
#
# Why this exists: npmjs.org needs a human-created npm account, and JSR needs
# a one-time browser OAuth to create the scope. The container registry needs
# neither — the workflow's built-in GITHUB_TOKEN already carries
# `packages:write`, so this is a distribution path that works unattended.
#
# The image is public and can be pulled anonymously:
#
#   docker run --rm -v "$PWD:/workspace" -w /workspace ghcr.io/aazh2026/specgate:0.1.4
#
# Tags published:
#   ghcr.io/aazh2026/specgate:0.1.4   (the release version)
#   ghcr.io/aazh2026/specgate:latest   (moves with the newest release)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the version from package.json
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test the published image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"
          echo "Checking --version"
          docker run --rm "$IMAGE" --version
